<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quem está em aula agora?</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2030;--mu:#667085;--bd:#e3e6ee;--ac:#2456d6;--chip:#eaf0ff;--ok:#12805c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--card:#181c27;--tx:#e8ebf4;--mu:#98a1b5;--bd:#2a3040;--ac:#7ea2ff;--chip:#222b45;--ok:#47d1a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131b;--card:#181c27;--tx:#e8ebf4;--mu:#98a1b5;--bd:#2a3040;--ac:#7ea2ff;--chip:#222b45;--ok:#47d1a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.15rem;margin:0 0 2px}.sub{color:var(--mu);font-size:.85rem}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:14px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.clock{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.slot{font-weight:600;color:var(--ok)}.slot.off{color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
input[type=search]{flex:1;min-width:180px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.c b{display:block;margin-bottom:6px}
.chip{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:.88rem}
.chip i{font-style:normal;color:var(--mu)}
.sim{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mu);font-size:.85rem;margin-top:16px}
.sec{grid-column:1/-1;font-weight:600;color:var(--mu);margin-top:8px}
.empty{color:var(--mu);padding:24px;text-align:center}
</style></head><body><main>
